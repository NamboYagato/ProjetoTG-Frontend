<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto-TG</title>
  </head>
  <body>
    <form id="form-login">
      <div>
        <label for="email-login">Email:</label>
        <input type="email" id="email-login" required />
      </div>

      <div>
        <label for="senha-login">Senha:</label>
        <input type="password" id="senha-login" required />
      </div>

      <div class="button">
        <button type="submit">Login</button>
      </div>
    </form>

    <form id="form-cadastro">
      <div>
        <label for="nome-cadastro">Nome:</label>
        <input type="text" id="nome-cadastro" required />
      </div>

      <div>
        <label for="email-cadastro">Email:</label>
        <input type="email" id="email-cadastro" required />
      </div>

      <div>
        <label for="senha-cadastro">Senha:</label>
        <input type="password" id="senha-cadastro" required />
      </div>

      <div class="button">
        <button type="submit">Cadastrar</button>
      </div>
    </form>

    <p id="erro"></p>
    <script type="module" src="/assets/js/login.js"></script>
  </body>
</html>
